# Exact GitHub Actions activation contract for workflows counted by ci-reach.
workflow: .github/workflows/ci.yml
expected-triggers: .github/workflows/ci.yml|pull_request,push
expected-trigger-filter: .github/workflows/ci.yml|pull_request|branches=main
expected-trigger-filter: .github/workflows/ci.yml|push|branches=main
expected-gate-job: .github/workflows/ci.yml|check
expected-job-activation: .github/workflows/ci.yml|check|continue-on-error=;if=;needs=
expected-job-matrix: .github/workflows/ci.yml|check|
