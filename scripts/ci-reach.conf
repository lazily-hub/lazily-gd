# CI-reachability configuration (#lzcheckcireachguard), read by check-ci-reach.sh.

workflow: .github/workflows/ci.yml

# ── the closure's MEMBERSHIP, pinned in both directions (#pinreachclosure) ──
#
# Everything above answers "is each target CI reaches a gate?". Nothing above
# answered "are these the targets?". Delete `load-graph` from `check:`'s
# prerequisite list and, MEASURED on a byte-identical scratch copy of this
# Makefile before these lines existed, the guard printed
#
#     check-ci-reach: OK -- 6 target(s) reached by CI, 0 excused, 1 carrying no gate
#
# at exit 0 and never named the target that left. A gate stopped being required
# and the guard approved. Same for `conformance-coverage`, the rung that proves
# the suite examined anything.
#
# `expected-closure-target` is the conf's spelling of the `EXPECTED_` prefix the
# sibling ledgers use in check-conformance-coverage.sh (`EXPECTED_LEDGERED_BLOCKS`),
# and it carries the same semantics: EXACT SET EQUALITY against the closure the
# guard walks, compared in BOTH directions and reported by name.
#
# Not a floor and not a ceiling, for the reason that replaced `MAX_LEDGERED_BLOCKS`
# with `EXPECTED_LEDGERED_BLOCKS` in this family: a floor passes a SWAP (drop one
# gate, add one), and a ceiling starts with zero slack and gains slack with every
# legitimate migration until the same attack passes again. The property that has
# to hold is FAILS-when-stale, not passes-when-stale.
#
# THE PIN IS NOT THE SAFETY PROPERTY. THE ORACLE IS. Read this before trusting
# the eight names below.
#
# The closure this pin is compared against is derived by awk-scanning Makefile
# SOURCE TEXT for the first `^check:` line. It never asks make and it does not
# evaluate make conditionals. MEASURED on a byte-identical scratch copy of this
# Makefile, wrapping the real `check:` line in
#
#     ifeq ($(SKIP_SLOW),)
#     check: test load-graph conformance-coverage assertion-ordering-check ci-reach
#     else
#     check: test ci-reach
#     endif
#
# `SKIP_SLOW=1` makes `make -n check` run ZERO `load_graph_check.gd` commands (1
# on the honest branch) while this guard's ENTIRE verdict stays `cmp -s`
# BYTE-IDENTICAL to the pristine healthy run at exit 0 -- with the membership pin
# in place and reporting `closure membership OK -- 8 target(s)`. `ifeq (0,1)` does
# it with no variable to set. lazily-js found this shape; the numbers above are
# this repo's, not js's.
#
# So a set-equality pin over that closure is a snapshot of a DERIVED set, and the
# derivation is the weak link: the pin passes the compromised state by
# construction, because the source text it reads is identical in both branches.
# What makes the guard a safety property is `closure oracle OK` -- for every
# walked target, its `make -n` commands must appear in `make -n check`'s. That
# comes from make, which is the thing that decides what runs. The pin's job is
# then real but secondary: it is what turns "a target left" from an invisible
# smaller number into a named, reviewable edit, and it is what stops a SWAP.
#
# Given the oracle, the pin's own failure direction is what makes it more than a
# snapshot: no slack in either direction, an absent pin is itself an error, and
# the only way to change the closure is an edit to this file that names the
# target. It cannot age into vacuity. Its claim is still only "no silent change",
# never "correct" -- it cannot tell you a gate is MISSING that never existed, and
# written from an already-broken Makefile it would faithfully pin the breakage.
#
# WHAT THE THREE PARTS TOGETHER STILL DO NOT COVER:
#
#   * A RECIPE SWAPPED FOR ANOTHER GATE CI ALREADY RUNS. Point `load-graph:` at
#     the conformance script and membership, classification and the oracle are
#     all satisfied, every count is unchanged, and the verdict is byte-identical.
#     Closing it needs a per-target recipe anchor -- a second spelling of every
#     recipe inside this guard, which the guard's own header records as the
#     mistake that cost lazily-cpp a hardcoded path plus a hand-written equality
#     assertion. That bounds the honest claim for this whole pin: it turns an
#     invisible drop into a reviewable edit, and this attack is an equally
#     reviewable edit that stays equally undetected.
#   * ORDER. `check:`'s prerequisites run left to right, and here that is
#     load-bearing -- `test` truncates and stamps the conformance manifest, which
#     `conformance-coverage` then reads. Reordering them keeps all three parts
#     satisfied. It is not a false green: the run-id rung refuses the other run's
#     evidence (MEASURED -- `make conformance-coverage` alone exits 1 with "is a
#     DIFFERENT run's evidence"), so order is enforced over there, not here.
#   * EDGES. `import` is a prerequisite of both `test` and `load-graph`. Drop the
#     `load-graph: import` edge and this set is unchanged and the oracle still
#     passes, because `test` still pulls `import` into the root's run -- `make
#     check` keeps working and `make load-graph` alone breaks. A node set cannot
#     see that.
#   * An excuse for a closure member pinned as gateless (here only `check`) is
#     still silently accepted, because such a target is not required in CI in the
#     first place.
expected-root-target: check

# ── CLASSIFICATION: which closure members legitimately carry no gate ──────────
#
# Membership says a target is still RUN; it cannot say the target still carries a
# GATE, and a gateless target is not required to appear in CI at all. MEASURED:
# replacing `load-graph`'s recipe with `@true` and keeping its name left the
# membership pin satisfied at 8/8 and reported
#
#     no gate  load-graph                       recipe runs no checkable command
#     check-ci-reach: OK -- 6 target(s) reached by CI, 0 excused, 2 carrying no gate
#
# at exit 0 -- the same verdict shape the guard's header records as the dry_run
# false green it already fixed, reached from a different direction.
#
# Only `check` belongs here, and for a structural reason rather than a tolerance:
# it is the aggregate, it has no recipe of its own, and `all: check` is what
# makes it the entry point. Every other member runs a real command.
#
# The empty set is a legitimate value for this pin, so it needs no
# "you must declare something" rung: a conf with no expected-nogate-target
# asserts that EVERY closure member carries a gate. Deleting the line below
# therefore fails CLOSED -- `check` is discovered gateless and matches nothing
# pinned.
expected-nogate-target: check
expected-closure-target: assertion-ordering-check
expected-closure-target: check
expected-closure-target: ci-reach
expected-closure-target: conformance-coverage
expected-closure-target: gdunit4
expected-closure-target: import
expected-closure-target: load-graph
expected-closure-target: test
